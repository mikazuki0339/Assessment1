    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Microsoft Yahei", SimSun, serif;
            scroll-behavior: smooth; /*点击目录，平滑滚动跳转*/
        }
        body{
            background-color:#24211d;
            color:#e8dfd0;
        }
        /* ==========顶部导航目录 ========== */
        nav{
            position:fixed;
            top:0;
            width:100%;
            padding:22px 50px;
            display:flex;
            justify-content:flex-end;
            gap:30px;
            background:linear-gradient(to bottom, rgba(36,33,29,0.9), transparent);
            z-index:99;
        }
        nav a{
            color:#e8dfd0;
            text-decoration:none;
            font-size:15px;
            opacity:0.75;
            transition:0.3s;
        }
        nav a:hover{
            opacity:1;
            color:#d4af37;
        }

        /* ==========首屏全屏封面（占满一整个屏幕） ========== */
        .hero{
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:0 20px;
            background-image: radial-gradient(rgba(210,180,140,0.08), transparent 70%);
        }
        .hero .en-title{
            font-size:16px;
            letter-spacing:4px;
            color:#c4a87c;
            margin-bottom:16px;
        }
        .hero h1{
            font-size:72px;
            color:#f0e6d6;
            font-weight:normal;
            margin-bottom:20px;
        }
        .hero .subtitle{
            font-size:20px;
            opacity:0.8;
            margin-bottom:40px;
        }
        .hero .scroll-tip{
            position:absolute;
            bottom:40px;
            font-size:14px;
            opacity:0.6;
        }

        /* ==========通用板块样式 + 滚动渐入动画 ========== */
        section{
            min-height:100vh;
            padding:80px 50px;
            max-width:1100px;
            margin:0 auto;
            opacity:0;
            transform:translateY(40px);
            transition:all 0.8s ease;
        }
        section.show{
            opacity:1;
            transform:translateY(0);
        }
        section h2{
            font-size:36px;
            color:#f0e6d6;
            margin-bottom:30px;
            font-weight:normal;
            border-left:4px solid #c4a87c;
            padding-left:16px;
        }

        /* 书籍简介板块 */
        .info-block{
            margin-bottom:18px;
            font-size:17px;
            line-height:1.7;
        }
        .info-block strong{
            color:#d4af37;
        }

        /* 视频板块 */
        video{
            width:100%;
            border-radius:12px;
            margin-top:20px;
        }

        /* 分镜项目：图片+文案+提示词 */
        .story-item{
            margin:50px 0;
        }
        .story-item img{
            width:100%;
            border-radius:12px;
            margin-bottom:14px;
        }
        .story-item .desc{
            font-size:16px;
            opacity:0.85;
            line-height:1.6;
            margin-bottom:8px;
        }
        .story-item .prompt{
            background:rgba(255,255,255,0.07);
            padding:12px 16px;
            border-radius:8px;
            font-size:14px;
            opacity:0.75;
        }

        /* 小结板块 */
        .summary-text{
            font-size:18px;
            line-height:1.8;
            opacity:0.88;
        }
    </style>
</head>
